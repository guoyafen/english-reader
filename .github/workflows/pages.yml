name: Publish English Reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extract website
        run: |
          cat site-full-book.zip.part01 site-full-book.zip.part02 site-full-book.zip.part03 > /tmp/site.zip
          echo "9e3e022627c33f02fe5dbe754f52c32496c267e3bd8c5cbd98f02cce97a2f91f  /tmp/site.zip" | sha256sum -c -
          unzip -q /tmp/site.zip -d _site
          test -f _site/index.html
          test -f _site/books.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
